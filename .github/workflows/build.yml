name: Build

on:
  push:
    branches-ignore: ['dev-**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BLENDER_VERSION: '4.2.0'
  BLENDER_SERIES: '4.2'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- Blender (headless)
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null

      - name: Build models in Blender
        id: blender
        run: |
          set -o pipefail
          tools/blender/build.sh ~/blender/blender 2>&1 | tee blender.log

      - name: Report Blender errors
        if: failure() && steps.blender.outcome == 'failure'
        run: |
          msg=$(tail -n 60 blender.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Blender build errors::$msg"

      # Hard gate: never ship textures GeckoLib will crash on.
      - name: Validate textures
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy || true
          python3 tools/validate_assets.py

      - name: Copy preview renders into the repo
        run: |
          mkdir -p docs/renders
          cp build/blender/*.png docs/renders/ 2>/dev/null || true

      - name: Upload Blender renders and .blend
        uses: actions/upload-artifact@v4
        with:
          name: blender-output
          path: |
            build/blender/
            src/main/resources/assets/orbital_railgun/geo/
            src/main/resources/assets/orbital_railgun/animations/
            src/main/resources/assets/orbital_railgun/textures/
            src/main/resources/assets/orbital_railgun/models/
            src/main/resources/assets/arsenal_legion/
            src/main/resources/assets/orbital_railgun/icon.png

      # Keep the repo's assets in sync with what Blender produced (main branch only).
      - name: Commit Blender-generated assets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/orbital_railgun src/main/resources/assets/arsenal_legion src/main/resources/orbital_railgun_collision.json docs/renders
          if git diff --cached --quiet; then echo "Assets unchanged"; else
            git commit -m "Regenerate models from Blender [skip ci]"
            git push
          fi

      # ---------------------------------------------------------------- Mod jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee gradle-build.log

      # Surface compiler errors as a single annotation (readable from the API without the log).
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = open("gradle-build.log", encoding="utf-8", errors="replace").read().splitlines()
          keep = []
          for i, l in enumerate(lines):
              if re.search(r"error:|What went wrong|Could not|> .*[Ee]xception|FAILED", l):
                  keep.extend(lines[i:i + 3])
          msg = "\n".join(dict.fromkeys(keep))[:60000] or "\n".join(lines[-80:])
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=Gradle build errors::{msg}")
          PY
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: deluxs-armory-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Read mod version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Every successful build on main updates a release with the ready-to-upload jar.
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Deluxs Armory ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/libs/deluxs-armory-${{ steps.ver.outputs.version }}.jar
