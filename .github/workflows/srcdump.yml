name: Source dump
on:
  push:
    branches: ['srcdump']
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew genSources --stacktrace
      - name: Collect
        run: |
          mkdir -p dump
          for j in $(find ~/.gradle .gradle -name "*minecraft*sources.jar" 2>/dev/null); do echo $j; unzip -o -q $j -d dump/src || true; done
          cd dump/src && zip -q -r ../mcsrc.zip net/minecraft com/mojang 2>/dev/null; ls -la ..
      - uses: actions/upload-artifact@v4
        with:
          name: mcsrc
          path: dump/mcsrc.zip
